<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
    <title>For My Love</title> 
    <style> 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background-color: #FFE6E9; 
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden; /* باش القلب ما يديرش سكرول فاش يكبر */
        } 

        .div1 { 
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        } 

        .div2 { 
            background-color: #FFF5F6; 
            border-radius: 15px; 
            padding: 20px; 
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(217, 95, 116, 0.15);
        } 

        h1 { 
            color: #7C1F3C; 
            font-family: "Playfair Display", serif; 
            font-size: 1.6rem;
            margin: 10px 0;
        } 

        #btn { 
            border: none;
            background-color: #F04434; 
            color: white; 
            border-radius: 25px; 
            padding: 10px 20px; 
            font-size: 1rem;
            cursor: pointer;
            touch-action: manipulation; /* كيحيد التعطيلة د الكليك فالتلفون */
        } 

        .div3 { 
            width: 100%;
            text-align: center;
            margin-top: 15px;
        } 


        h3 { 
            display: none; 
            color: #7C1F3C; 
            font-weight: bold; 
            font-size: 1.1rem;
            line-height: 1.6;
            direction: rtl;
        } 
    </style> 
</head> 
<body> 
    <div class="div1"> 
        <div class="div2"> 
            <p>Just for you alhbiba dyali</p> 
            <h1>FOR MY LOVE <br>HAFESSA <i style="color: #F04434;" class="fa-solid fa-heart"></i></h1> 
            <p style="margin-bottom: 12px;">You are my life i love you</p> 
            <button id="btn" type="button">BRKI HNAYA <i style="color: rgb(245, 110, 222);" class="fa-solid fa-heart"></i></button> 
        </div> 
        
        <div class="div3"> 
            <i id="lasti" class="fa-solid fa-heart"></i> 
            <h3 id="msg">❤️ وحتى إلا اختفى هاد القلب… حبي ليك عمرو ما يختافي الحبيبة ديالي</h3> 
        </div> 
    </div> 
    <script src="index.js"></script> 
</body> 
</html>
