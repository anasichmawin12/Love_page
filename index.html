<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
    <title>For My Love</title> 
    <style> 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background-color: #FFE6E9; 
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        } 

        .div1 { 
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        } 

        .div1 .div2 { 
            background-color: #FFF5F6; 
            border-radius: 15px; 
            padding: 25px 20px; 
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(217, 95, 116, 0.15);
        } 

        .div1 .div2 div { 
            color: #D95F74; 
        } 

        h1 { 
            color: #7C1F3C; 
            font-family: "Playfair Display", serif; 
            font-size: 1.8rem;
            line-height: 1.3;
            margin: 15px 0;
        } 

        .sub-text {
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        #btn { 
            border: none;
            background-color: #F04434; 
            color: white; 
            border-radius: 25px; 
            padding: 10px 24px; 
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        } 

        #btn:active {
            transform: scale(0.95);
        }

        .div3 { 
            width: 100%;
            text-align: center;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            gap: 15px;
        } 

        h3 { 
            font-family: "Playfair Display", serif; 
            display: none; 
            color: #7C1F3C; 
            font-weight: bold; 
            font-size: 1.2rem;
            line-height: 1.6;
            direction: rtl;
            padding: 0 10px;
        } 

        /* تعديلات مخصصة للشاشات الصغيرة */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
            .div1 .div2 {
                padding: 20px 15px;
            }
            h3 {
                font-size: 1.05rem;
            }
        }
    </style> 
</head> 
<body> 
    <div class="div1"> 
        <div class="div2"> 
            <div> 
                <p>Just for you alhbiba dyali</p> 
                <h1>FOR MY LOVE <br>HAFESSA <i style="color: #F04434;" class="fa-solid fa-heart"></i></h1> 
                <p class="sub-text">You are my life i love you</p> 
                <button id="btn">BRKI HNAYA <i style="color: rgb(245, 110, 222);" class="fa-solid fa-heart"></i></button> 
            </div> 
        </div> 
        
        <div class="div3"> 
            <i id="lasti" style="color: #F04434; font-size: 40px;" class="fa-solid fa-heart"></i> 
            <h3> وحتى إلا اختفى هاد القلب… حبي ليك عمرو ما يختافي الحبيبة ديالي❤️</h3> 
        </div> 
    </div> 
    <script src="index.js"></script> 
</body> 
</html>
